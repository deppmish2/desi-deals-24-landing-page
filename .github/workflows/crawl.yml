name: Daily Crawl

on:
  schedule:
    - cron: "0 8 * * *"
    - timezone: "Europe/Berlin"
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full daily crawl into Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DESI_DEALS_DB_TURSO_DATABASE_URL: ${{ secrets.DESI_DEALS_DB_TURSO_DATABASE_URL }}
          DESI_DEALS_DB_TURSO_AUTH_TOKEN: ${{ secrets.DESI_DEALS_DB_TURSO_AUTH_TOKEN }}
          DB_BOOTSTRAP_ON_STARTUP: "true"
        run: npm run crawl

      - name: Warm public deals cache
        env:
          CLIENT_APP_URL: ${{ secrets.CLIENT_APP_URL }}
        shell: bash
        run: |
          base_url="${CLIENT_APP_URL%/}"
          if [ -z "$base_url" ]; then
            echo "Skipping warm step: CLIENT_APP_URL not configured."
            exit 0
          fi

          today_key="$(TZ=Europe/Berlin date +%F)"
          curl --fail --silent --show-error "$base_url/api/v1/deals?limit=20&page=1&in_stock=1&cache_date=$today_key" >/dev/null
