name: Daily Crawl

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Decide Berlin crawl window
        id: gate
        shell: bash
        run: |
          berlin_hour="$(TZ=Europe/Berlin date +%H)"
          berlin_date="$(TZ=Europe/Berlin date +%F)"
          echo "berlin_hour=$berlin_hour" >> "$GITHUB_OUTPUT"
          echo "berlin_date=$berlin_date" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$berlin_hour" = "07" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip outside Berlin window
        if: steps.gate.outputs.should_run != 'true'
        run: |
          echo "Skipping crawl."
          echo "Berlin date: ${{ steps.gate.outputs.berlin_date }}"
          echo "Berlin hour: ${{ steps.gate.outputs.berlin_hour }}"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci

      - name: Run full daily crawl into Turso
        if: steps.gate.outputs.should_run == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DESI_DEALS_DB_TURSO_DATABASE_URL: ${{ secrets.DESI_DEALS_DB_TURSO_DATABASE_URL }}
          DESI_DEALS_DB_TURSO_AUTH_TOKEN: ${{ secrets.DESI_DEALS_DB_TURSO_AUTH_TOKEN }}
        run: npm run crawl
