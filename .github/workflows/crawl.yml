name: Daily Crawl

on:
  schedule:
    - cron: "50 5 * * *" # start once daily, then wait until 08:00 Europe/Berlin
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Wait for 08:00 Europe/Berlin
        shell: bash
        run: |
          berlin_date="$(TZ=Europe/Berlin date +%F)"
          berlin_now="$(TZ=Europe/Berlin date '+%F %T %Z')"
          target_epoch="$(TZ=Europe/Berlin date -d "$berlin_date 08:00:00" +%s)"
          now_epoch="$(date +%s)"
          sleep_seconds=$((target_epoch - now_epoch))

          echo "Berlin now: $berlin_now"
          echo "Berlin target date: $berlin_date"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run detected; starting crawl immediately."
            exit 0
          fi

          if [ "$sleep_seconds" -gt 0 ]; then
            echo "Waiting $sleep_seconds seconds until 08:00 Europe/Berlin."
            sleep "$sleep_seconds"
          else
            echo "Already at or past 08:00 Europe/Berlin; continuing immediately."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run full daily crawl into Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DESI_DEALS_DB_TURSO_DATABASE_URL: ${{ secrets.DESI_DEALS_DB_TURSO_DATABASE_URL }}
          DESI_DEALS_DB_TURSO_AUTH_TOKEN: ${{ secrets.DESI_DEALS_DB_TURSO_AUTH_TOKEN }}
          DB_BOOTSTRAP_ON_STARTUP: "true"
        run: npm run crawl

      - name: Warm public deals cache
        env:
          CLIENT_APP_URL: ${{ secrets.CLIENT_APP_URL }}
        shell: bash
        run: |
          base_url="${CLIENT_APP_URL%/}"
          if [ -z "$base_url" ]; then
            echo "Skipping warm step: CLIENT_APP_URL not configured."
            exit 0
          fi

          today_key="$(TZ=Europe/Berlin date +%F)"
          curl --fail --silent --show-error "$base_url/api/v1/store-products?limit=20&page=1&in_stock=1&cache_date=$today_key" >/dev/null
